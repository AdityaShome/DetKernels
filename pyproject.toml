[project]
name = "detkernels"
version = "0.1.0"
description = "Deterministic / batch-invariant inference kernel library and reproducibility harness"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "openai",
]

[project.optional-dependencies]
localizer = ["torch", "transformers", "accelerate"]
kernels = ["torch", "triton"]
gdn = ["torch", "triton", "flash-linear-attention"]
dev = ["pytest"]

[project.scripts]
detkernels-audit = "harness.cli:main"
detkernels-kernel-check = "kernels.integration:main"
detkernels-kernel-bench = "kernels.benchmark:main"
detkernels-gdn-repro = "gdn.repro:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["harness", "kernels", "gdn"]
